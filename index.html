<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 2 – Équipe ton entreprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@700&family=Playfair+Display:ital,wght@1,700&family=Fredoka:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1220; --panel:#121B2C; --panel2:#182438; --panel3:#213150;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --text:#EEF2F8; --muted:#A3AFC4; --dim:#71809A;
  --gold:#E3B85C; --gold2:#F6D88F; --steel:#7CB0FF; --mint:#4FD69C; --coral:#FF6F6F; --amber:#FFB454;
  --paper:#F6F1E7; --paper2:#EDE5D4; --paper-ink:#1B2233; --paper-muted:#5B6478; --paper-line:#D6CDBB;
  --brand:#2F6FED; --on-brand:#ffffff;
  --r:14px; --r-lg:22px;
  --display:'Bricolage Grotesque','Segoe UI',Arial,sans-serif; --ui:'IBM Plex Sans','Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ui);background:var(--ink);color:var(--text);min-height:100vh;font-size:16.5px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:3px}
[hidden]{display:none!important}
b,strong{font-weight:600}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;font-weight:700;letter-spacing:-.01em}

/* ═══ Fond : quadrillage de livre de comptes + halo de la couleur de l'entreprise ═══ */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.grid-bg::after{content:'';position:absolute;inset:-20% -10% auto;height:70vh;
  background:radial-gradient(60% 60% at 30% 0%,color-mix(in srgb,var(--brand) 28%,transparent),transparent 70%),radial-gradient(40% 50% at 85% 10%,rgba(227,184,92,.14),transparent 70%);transition:background 1s}

/* ═══ Barre du haut : identité + indicateurs vivants ═══ */
.top{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:18px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent);transition:background .5s}
.mark.emo{font-size:24px}
.top h1{font-size:19px;font-weight:700}
.top h1 small{display:block;font-family:var(--ui);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.kpis{margin-left:auto;display:flex;gap:8px}
.kpi{padding:7px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);min-width:118px}
.kpi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.kpi b{display:block;font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap}
.kpi.ok b{color:var(--mint)} .kpi.warn b{color:var(--amber)} .kpi.bad b{color:var(--coral)}
.who{text-align:right;font-size:13px;color:var(--muted);line-height:1.25;padding-left:10px;border-left:1px solid var(--line)}
.who b{display:block;color:var(--text);font-size:14px}
.who button{background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.xp{font-family:var(--mono);font-size:13px;color:var(--gold2);padding:6px 12px;border-radius:999px;border:1px solid rgba(227,184,92,.35);background:rgba(227,184,92,.08);white-space:nowrap}
.xp small{color:var(--muted);font-family:var(--ui)}

/* ═══ Mise en page : rail des étapes | contenu | tableau de bord ═══ */
.layout{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:24px 22px 80px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.layout.solo{grid-template-columns:minmax(0,1fr);max-width:1080px}
.layout aside{align-self:stretch}
.rail{display:none}
main{min-width:0}
.rail{position:sticky;top:84px}
.rail ol{list-style:none}
.rail li{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;color:var(--dim);font-size:14px;position:relative}
.rail li .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none;background:var(--panel)}
.rail li.done{color:var(--muted)} .rail li.done .n{background:var(--mint);border-color:var(--mint);color:#07261a}
.rail li.now{color:var(--text);background:rgba(255,255,255,.05);font-weight:600} .rail li.now .n{background:var(--gold);border-color:var(--gold);color:#2b1d02}
.rail li:not(:last-child)::after{content:'';position:absolute;left:22px;top:38px;width:1.5px;height:12px;background:var(--line2)}
.rail .mini{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.5}

/* ═══ Barre des étapes (horizontale, comme à l'origine) ═══ */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stp{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;color:var(--dim);white-space:nowrap}
.stp .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:11px}
.stp.done{color:var(--muted)} .stp.done .n{background:var(--mint);border-color:var(--mint);color:#07261a}
.stp.now{color:var(--text);border-color:rgba(255,61,139,.6);background:rgba(255,61,139,.12);font-weight:600} .stp.now .n{background:var(--grad,var(--gold));border-color:transparent;color:#fff}
.steps-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 22px} .steps-bar i{display:block;height:100%;background:var(--grad,var(--gold));transition:width .5s}

/* ═══ Blocs ═══ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.card.tight{padding:18px}
.card h3{font-size:19px;margin-bottom:10px}
.kick{font-size:13px;color:var(--muted);margin-bottom:8px}
.kick b{color:var(--gold);font-family:var(--mono);font-weight:500}
.title{font-size:clamp(28px,3.6vw,40px);margin-bottom:10px;max-width:22ch}
.lead{color:var(--muted);max-width:66ch;margin-bottom:22px;font-size:16.5px}
.sub{font-family:var(--display);font-size:17px;font-weight:600;margin:22px 0 10px;color:var(--text)}
.help{font-size:13.5px;color:var(--muted);margin-top:8px}
.err{font-size:14px;color:var(--coral);margin-top:8px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:rgba(124,176,255,.08);border:1px solid rgba(124,176,255,.25);font-size:15px;margin:14px 0}
.note.gold{background:rgba(227,184,92,.08);border-color:rgba(227,184,92,.3)}
.note.warn{background:rgba(255,180,84,.09);border-color:rgba(255,180,84,.35)}
.note.bad{background:rgba(255,111,111,.08);border-color:rgba(255,111,111,.35)}
.note.ok{background:rgba(79,214,156,.08);border-color:rgba(79,214,156,.3)}
.note .i{font-size:22px;line-height:1;flex:none}
.coach{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(227,184,92,.1),rgba(124,176,255,.07));border:1px solid rgba(227,184,92,.25);margin-bottom:22px}
.coach .av{width:46px;height:46px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;font-size:24px;flex:none;border:1px solid var(--line2)}
.coach p{font-size:15.5px;color:var(--text)} .coach p b{color:var(--gold2)}
.coach small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))} .row3{grid-template-columns:2fr 1fr 1fr}

/* choix (cartes cliquables) */
.choice{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;position:relative;display:block;width:100%}
.choice:hover{border-color:var(--line2);background:var(--panel3)}
.choice.on{border-color:var(--gold);background:rgba(227,184,92,.09);box-shadow:0 0 0 3px rgba(227,184,92,.15)}
.choice.on::before{content:'✓';position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2b1d02;display:grid;place-items:center;font-size:13px;font-weight:700}
.choice.full{opacity:.45;cursor:not-allowed}
.choice .ico{font-size:30px;line-height:1;margin-bottom:8px}
.choice h4{font-size:17px;margin-bottom:4px}
.choice p{font-size:14px;color:var(--muted)}
.choice .meta{margin-top:10px;font-size:13px;color:var(--muted);display:grid;gap:3px} .choice .meta b{color:var(--text)}
.choice .tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);margin:8px 6px 0 0}
.choice .tag.full{color:var(--coral);border-color:rgba(255,111,111,.5)}
.choice .pro,.choice .con{display:block;font-size:13.5px;margin-top:5px;padding-left:18px;position:relative}
.choice .pro::before{content:'+';position:absolute;left:0;color:var(--mint);font-weight:700} .choice .con::before{content:'−';position:absolute;left:0;color:var(--coral);font-weight:700}
.choice .cost{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:13px;color:var(--gold2);padding:4px 10px;border-radius:8px;background:rgba(227,184,92,.1)}
.sec-primaire .ico{filter:drop-shadow(0 0 10px rgba(79,214,156,.5))} .sec-secondaire .ico{filter:drop-shadow(0 0 10px rgba(124,176,255,.5))} .sec-tertiaire .ico{filter:drop-shadow(0 0 10px rgba(227,184,92,.5))}
.sector-h{display:flex;align-items:center;gap:14px;margin:22px 0 10px} .sector-h .rule{flex:1;height:1px;background:var(--line)} .sector-h span{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--muted);transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--text)} .chip.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.inp{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);color:var(--text);font-size:16px}
.inp:focus{border-color:var(--steel);outline:none;background:rgba(124,176,255,.05)}
select.inp{background:#1b1233} select.inp option{background:#1b1233;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;border:1.5px solid transparent;font-weight:600;font-size:15.5px;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)} .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn-main{background:var(--gold);color:#2b1d02;box-shadow:0 8px 26px rgba(227,184,92,.25)} .btn-main:not([disabled]):hover{background:var(--gold2)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--text)} .btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-steel{background:var(--steel);color:#071a3a}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.hint{font-size:13.5px;color:var(--amber)}
.spin{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.25);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.btn-ghost .spin{border-color:rgba(255,255,255,.25);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sw{width:50px;height:50px;border-radius:14px;border:3px solid transparent;cursor:pointer;position:relative;transition:transform .12s}
.sw.small{width:40px;height:40px;border-radius:11px}
.sw:hover{transform:scale(1.08)} .sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--ink),0 0 0 5px #fff}
.sw span{position:absolute;left:50%;top:110%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted)}
.sym{width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line2);background:var(--panel2);font-size:26px;cursor:pointer;display:grid;place-items:center}
.sym.on{border-color:var(--gold);background:rgba(227,184,92,.12)}
.stylebtn{font-size:26px;padding:16px 18px;line-height:1.1} .stylebtn small{display:block;font-family:var(--ui);font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:400;font-style:normal;letter-spacing:0}
.f-moderne{font-family:Outfit,Arial,sans-serif;font-weight:700} .f-elegant{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700} .f-fun{font-family:Fredoka,'Comic Sans MS',sans-serif;font-weight:600} .f-street{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.04em;font-size:1.25em}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.opt{border:1.5px solid var(--line2);background:var(--panel2);border-radius:11px;padding:9px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text)}
.opt.on{border-color:var(--gold);background:rgba(227,184,92,.12)} .opt .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.opt small{color:var(--muted);font-size:12.5px}

/* ═══ Tableaux chiffrés ═══ */
table.led{width:100%;border-collapse:collapse;font-size:14.5px}
table.led th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.led td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.led td.n,table.led th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.led tr.tot td{font-weight:700;border-top:2px solid var(--line2);border-bottom:0;background:rgba(255,255,255,.03)}
table.led tr.on td{background:rgba(227,184,92,.1)}
table.led td.neg,.neg{color:var(--coral)} .pos{color:var(--mint)}
.money{font-family:var(--mono)}

/* bilan en deux colonnes */
.bilan{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.bilan .col{padding:0} .bilan .col+.col{border-left:1px solid var(--line2)}
.bilan h5{font-family:var(--display);font-size:14px;padding:10px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700}
.bilan h5 small{font-family:var(--ui);font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.bilan .l{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:14px;border-bottom:1px dashed var(--line)}
.bilan .l .k{color:var(--muted)} .bilan .l .k b{color:var(--text);display:block;font-weight:500}
.bilan .l .v{font-family:var(--mono);white-space:nowrap}
.bilan .l.vide{color:var(--dim);font-style:italic}
.bilan .sect{font-size:11.5px;color:var(--dim);padding:8px 14px 2px;font-weight:600}
.bilan .t{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;font-family:var(--mono);background:rgba(227,184,92,.1);border-top:1px solid var(--line2)}
.bilan-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.bilan-foot b{color:var(--mint)}

/* jauge d'autonomie */
.gauge{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;margin:8px 0 4px}
.gauge i{position:absolute;inset:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--coral),var(--amber) 35%,var(--mint) 70%);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.big-n{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1}
.big-n small{font-family:var(--ui);font-size:14px;color:var(--muted);font-weight:400}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.stat3.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat3 .s{padding:14px 16px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line)}
.stat3 .s span{display:block;font-size:12.5px;color:var(--muted)} .stat3 .s b{display:block;font-family:var(--mono);font-size:20px;margin-top:4px}

/* barres d'étude de marché */
.bars{display:grid;gap:10px;margin-top:10px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:12px;font-size:14px}
.bar .track{height:14px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden} .bar .fill{display:block;height:100%;border-radius:999px;background:var(--steel);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .v{font-family:var(--mono);text-align:right}

/* ═══ Documents « papier » ═══ */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.06);position:relative;overflow:hidden;font-size:14.5px}
.paper::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");opacity:.08;mix-blend-mode:multiply;pointer-events:none}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:14px}
.paper .ph h4{font-size:17px;font-weight:800;letter-spacing:0} .paper .ph small{display:block;color:var(--paper-muted);font-size:12px;font-weight:400}
.paper .ph .ref{font-family:var(--mono);font-size:11.5px;color:var(--paper-muted);text-align:right}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.paper dt{color:var(--paper-muted)} .paper dd{font-weight:500} .paper dd .num{font-family:var(--mono);background:#fff;padding:2px 8px;border-radius:5px;border:1px solid var(--paper-line);letter-spacing:.04em}
.paper .foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--paper-muted);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seal{width:84px;height:84px;border-radius:50%;border:3px double var(--brand);display:grid;place-items:center;text-align:center;font-size:9px;font-weight:700;color:var(--brand);transform:rotate(-12deg);line-height:1.15;padding:8px;background:rgba(255,255,255,.5);flex:none}
.seal b{display:block;font-size:20px;line-height:1}

.paper table.led th{color:var(--paper-muted);border-bottom-color:var(--paper-ink)} .paper table.led td{border-bottom-color:var(--paper-line)}
.paper table.led tr.tot td{border-top-color:var(--paper-ink);background:rgba(0,0,0,.04)}
.paper .bilan{background:#fff;border-color:var(--paper-line)} .paper .bilan h5{background:var(--paper2);border-color:var(--paper-line)} .paper .bilan .col+.col{border-color:var(--paper-line)}
.paper .bilan .l{border-color:var(--paper-line)} .paper .bilan .l .k{color:var(--paper-muted)} .paper .bilan .l .k b{color:var(--paper-ink)} .paper .bilan .t{background:var(--paper2);border-color:var(--paper-line)} .paper .bilan .sect{color:var(--paper-muted)}
.sigline{margin-top:16px;display:flex;justify-content:flex-end}
.sigline div{min-width:260px;border-top:1px solid var(--paper-ink);padding-top:6px;font-size:12px;color:var(--paper-muted)}
.sigline input{width:100%;border:0;border-bottom:1px dashed var(--paper-line);background:transparent;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:22px;color:var(--brand);padding:4px 0;outline:none}
.engage{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:rgba(255,255,255,.04);border:1px solid var(--line2);margin-top:18px;cursor:pointer;font-size:15px}
.engage input{width:20px;height:20px;accent-color:var(--gold);margin-top:3px}
.chk{list-style:none;margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.chk li::before{content:'○ ';color:var(--dim)} .chk li.ok{color:var(--mint)} .chk li.ok::before{content:'● '}

/* carte bancaire */
.bankcard{aspect-ratio:1.586;border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 85%,#000) 0%,var(--brand) 55%,color-mix(in srgb,var(--brand) 60%,#fff) 140%);box-shadow:0 22px 50px rgba(0,0,0,.5);max-width:420px;font-family:var(--mono)}
.bankcard::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.22),transparent 55%)}
.bankcard .bank{position:absolute;top:18px;right:22px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;opacity:.95}
.bankcard .chipc{width:44px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f3d58a,#c79a3c);position:relative;margin-top:6px}
.bankcard .chipc::after{content:'';position:absolute;inset:7px 6px;border:1px solid rgba(0,0,0,.25);border-radius:4px}
.bankcard .iban{font-size:17px;letter-spacing:.08em;margin-top:30px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.bankcard .holder{margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.bankcard .holder b{display:block;font-size:14px;font-weight:600;letter-spacing:.04em}
.bankcard .holder small{display:block;font-size:9.5px;opacity:.8;letter-spacing:.1em}
.bankcard.dim{filter:grayscale(.6);opacity:.55}

/* vitrine, logo, carte de visite */
.front-wrap{border-radius:var(--r-lg);overflow:hidden;background:#0E1A2E;border:1px solid var(--line)}
.front{display:block;width:100%;height:auto}
.logo-prev{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);margin-bottom:18px}
.logo-mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;flex:none;border:4px solid rgba(255,255,255,.08)}
.logo-name{font-size:28px;line-height:1.1}
.logo-slogan{font-size:14px;color:var(--muted);margin-top:4px;font-family:var(--ui);font-style:normal;letter-spacing:0;font-weight:400}
.biz{background:#fff;color:var(--paper-ink);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,.4);aspect-ratio:1.75;max-width:360px;font-size:12px;position:relative;overflow:hidden}
.biz::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--brand)}
.biz .bn{font-size:17px;line-height:1.1} .biz .bs{color:var(--paper-muted);font-style:italic;margin-bottom:8px}
.biz .who2{font-weight:700;font-size:13px;margin-top:4px}
.boutique-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.duo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center;margin-top:22px}

/* ═══ Tableau de bord (colonne droite) ═══ */
.dash{position:sticky;top:76px;display:grid;gap:12px;max-height:calc(100vh - 90px);overflow:auto;padding-right:2px}
.dash .front-wrap{border-radius:var(--r)}
.dash .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.dash .m3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .dash .m3 div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:11.5px;color:var(--muted)} .dash .m3 b{display:block;font-family:var(--mono);font-size:14px;color:var(--text);margin-top:2px}
.dash h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dash h3 b{color:var(--text)}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.srow .k{color:var(--muted)} .srow .v{text-align:right;font-weight:500} .srow .v.todo{color:var(--dim);font-style:italic;font-weight:400}
.pbar{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mint));transition:width .6s}
.dash .bilan .l{padding:6px 12px;font-size:12.5px} .dash .bilan h5{padding:8px 12px;font-size:12.5px} .dash .bilan .t{padding:8px 12px;font-size:13px}
.lvl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)} .lvl b{font-family:var(--display);color:var(--gold2);font-size:15px}

/* ═══ Écrans d'accueil / briefing / fin ═══ */
.hero{text-align:left;padding:30px 0 10px;max-width:980px}
.hero h2{font-size:clamp(38px,6vw,66px);line-height:.98;letter-spacing:-.025em;margin:16px 0 18px;max-width:14ch}
.hero .lead{font-size:18px;max-width:58ch}
.school{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--muted)}
.school .mark{width:30px;height:30px;border-radius:8px;font-size:12px;box-shadow:none}
.login{max-width:520px;margin-top:28px}
.road{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.road li{padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--muted);display:grid;gap:4px}
.road li .n{font-family:var(--mono);font-size:12px;color:var(--dim)} .road li b{color:var(--text);font-family:var(--display);font-size:15px}
.road li.now{border-color:var(--gold);background:rgba(227,184,92,.08)} .road li.now .n{color:var(--gold)}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
.goal{padding:18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)} .goal .gi{font-size:28px;margin-bottom:6px} .goal b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px} .goal p{font-size:14px;color:var(--muted)}
.today{display:flex;flex-wrap:wrap;gap:8px}
.today span{font-size:13.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:center} .stat b{display:block;font-family:var(--mono);font-size:26px} .stat span{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.badge{padding:12px 8px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);text-align:center;font-size:12.5px} .badge .i{font-size:28px;margin-bottom:4px} .badge.lockd{opacity:.35} .badge b{display:block;font-weight:500}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.word{padding:12px 14px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);font-size:13.5px} .word b{display:block;color:var(--gold2);font-family:var(--display);font-size:15px;margin-bottom:3px} .word span{color:var(--muted)}
.status{padding:12px 16px;border-radius:var(--r);font-size:14.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.status.ok{background:rgba(79,214,156,.1);border:1px solid rgba(79,214,156,.35)} .status.err{background:rgba(255,111,111,.1);border:1px solid rgba(255,111,111,.35)} .status.wait{background:rgba(124,176,255,.08);border:1px solid rgba(124,176,255,.3)}
.next{display:flex;gap:16px;align-items:center;padding:18px;border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line);margin-top:20px} .next .ic{font-size:34px}

/* défi éclair */
.quiz{border:1.5px solid rgba(124,176,255,.35);border-radius:var(--r-lg);padding:18px 20px;background:rgba(124,176,255,.06);margin-top:18px}
.quiz h4{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px} .quiz h4 .pts{font-family:var(--mono);font-size:12px;color:var(--gold2);border:1px solid rgba(227,184,92,.4);padding:2px 8px;border-radius:999px}
.quiz p{font-size:15px;margin-bottom:10px}
.quiz .q{display:grid;gap:8px} .quiz .q button{text-align:left;padding:10px 14px;border-radius:11px;border:1.5px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:14.5px}
.quiz .q button.ok{border-color:var(--mint);background:rgba(79,214,156,.15)} .quiz .q button.ko{border-color:var(--coral);background:rgba(255,111,111,.12)} .quiz .q button[disabled]{cursor:default}
.quiz .exp{margin-top:10px;font-size:14px;color:var(--muted)}
.bonus{border:1.5px dashed rgba(227,184,92,.5);border-radius:var(--r-lg);padding:18px 20px;margin-top:18px;background:rgba(227,184,92,.05)}
.bonus h4{font-size:16px;color:var(--gold2)} .bonus p{font-size:14.5px;color:var(--muted);margin:6px 0 10px} .bonus.won{border-style:solid;border-color:var(--mint)} .bonus.won h4{color:var(--mint)}

/* banque : décision */
.bank{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px 18px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);margin-top:12px}
.bank .dec{font-family:var(--display);font-weight:700;font-size:15px;padding:8px 14px;border-radius:10px}
.bank .dec.ok{background:rgba(79,214,156,.15);color:var(--mint)} .bank .dec.ko{background:rgba(255,111,111,.15);color:var(--coral)}
.money-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:8px}
.money-opts .choice{padding:12px 14px;text-align:center} .money-opts .choice::before{display:none} .money-opts .choice b{font-family:var(--mono);font-size:19px;display:block} .money-opts .choice small{font-size:12px;color:var(--muted)}

/* toasts, modal, confettis, print */
#toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:grid;gap:8px}
.toast{background:#1c1236;border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:12px 16px;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:tin .35s cubic-bezier(.2,.8,.2,1);max-width:340px}
.toast b{color:var(--gold2);font-family:var(--mono)} .toast .wd{color:var(--muted);font-size:13px;margin-top:4px}
.toast.word{border-color:rgba(124,176,255,.5)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,9,18,.75);display:grid;place-items:center;padding:20px}
.modal .box{background:#160f2c;border:1px solid var(--line2);border-radius:var(--r-lg);padding:24px;max-width:860px;width:100%;max-height:90vh;overflow:auto}
.modal pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--muted);margin:14px 0}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.reveal{animation:rev .7s cubic-bezier(.2,.8,.2,1) both}
.reveal.d1{animation-delay:.35s} .reveal.d2{animation-delay:.8s} .reveal.d3{animation-delay:1.25s}
@keyframes rev{from{opacity:0;transform:translateY(26px) scale(.97)}}
#print-area{display:none}
@media print{body>*{display:none!important} body{background:#fff;color:#000} #print-area{display:block!important;color:#000} #print-area .paper{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;margin-bottom:8mm;background:#fff} .bankcard{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact} .paper .bilan{border:1px solid #ccc}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1240px){.kpi{min-width:0}}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);padding:18px 14px 60px} .layout aside{position:static} .dash{position:static;max-height:none} .stp .lab{display:none} .stp.now .lab{display:inline}
  .kpis{display:none} .who{display:none} .g2,.g3,.g4,.row,.row3,.boutique-grid,.duo,.goals,.words,.bilan{grid-template-columns:minmax(0,1fr)} .bilan .col+.col{border-left:0;border-top:1px solid var(--line2)} .stats,.stat3,.stat3.five{grid-template-columns:repeat(2,minmax(0,1fr))} .dash{grid-template-columns:minmax(0,1fr)} .bar{grid-template-columns:110px 1fr 50px} .title{font-size:28px}}

/* ═══ Mission 2 : achats, documents, banque ═══ */
.sub-steps{display:flex;gap:6px;flex-wrap:wrap;margin:-10px 0 18px}
.ss{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line)}
.ss i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:9px;font-family:var(--mono)}
.ss.done{color:var(--muted)} .ss.done i{background:var(--mint);border-color:var(--mint);color:#07261a} .ss.now{color:var(--text);border-color:rgba(255,61,139,.6);background:rgba(255,61,139,.12)} .ss.now i{background:var(--grad);border-color:transparent;color:#fff}
.achat-tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px} .achat-tag b{color:var(--text)}
.budget-opt b{font-family:var(--mono);font-size:20px;display:block} .budget-opt small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.offer{position:relative;text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;color:var(--text);display:flex;flex-direction:column}
.offer:hover{border-color:var(--line2)} .offer.on{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,61,139,.22)}
.offer .oh{padding:12px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line)} .offer .oh b{display:block;font-family:var(--display);font-size:16px} .offer .oh small{color:var(--muted);font-size:12px}
.offer .ob{padding:12px 14px;font-size:13.5px;flex:1} .offer .ob p{color:var(--muted);margin-bottom:8px}
.offer .ol{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px} .offer .ol span:last-child{font-family:var(--mono)}
.offer .ot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:rgba(255,255,255,.05);border-top:1px solid var(--line)} .offer .ot b{font-family:var(--mono);font-size:19px} .offer .ot small{color:var(--muted);font-size:12px}
.offer .best{position:absolute;top:10px;right:10px;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--mint);color:#07261a;font-weight:700}
.offer.on .oh::after{content:'✓ choisie';position:absolute;top:10px;right:10px;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--pink);color:#fff;font-weight:700}
.cmp{overflow-x:auto;margin-top:14px} .cmp table.led th:first-child{min-width:140px}
.doc-lines{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.doc-lines th{text-align:left;font-size:11.5px;color:var(--paper-muted);border-bottom:1.5px solid var(--paper-ink);padding:6px 8px} .doc-lines td{padding:7px 8px;border-bottom:1px solid var(--paper-line)}
.doc-lines td.n,.doc-lines th.n{text-align:right;font-family:var(--mono);white-space:nowrap} .doc-lines tr.tot td{font-weight:700;border-top:2px solid var(--paper-ink);border-bottom:0} .doc-lines tr.sub td{color:var(--paper-muted)} .doc-lines tr.err td{background:rgba(251,113,133,.14)}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 12px;font-size:13px} .paper .parties b{display:block;font-size:11.5px;color:var(--paper-muted);margin-bottom:3px;font-weight:600}
.paper .cond{font-size:12.5px;color:var(--paper-muted);margin-top:8px}
.paper.doc-sm{font-size:13px;padding:18px 20px}
.sms{max-width:380px;border-radius:18px;background:#fff;color:#1b2233;padding:14px 16px;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.4);margin:10px 0}
.sms .from{font-size:11.5px;color:#5B6478;margin-bottom:4px;display:flex;justify-content:space-between} .sms b{color:var(--brand)}
.checks{display:grid;gap:8px;margin:12px 0}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2);cursor:pointer;font-size:14.5px} .check input{width:20px;height:20px;accent-color:var(--pink);margin-top:2px}
.check.ok{border-color:rgba(52,211,153,.5)}
.decision{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.extrait{background:#fff;color:#1b2233;border-radius:10px;padding:16px 18px;font-size:13.5px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.extrait .eh{display:flex;justify-content:space-between;border-bottom:2px solid #1b2233;padding-bottom:6px;margin-bottom:8px;font-weight:700} .extrait .eh small{font-weight:400;color:#5B6478;font-family:var(--mono)}
.extrait .el{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:6px 0;border-bottom:1px dashed #D6CDBB;font-size:13px} .extrait .el .d{font-family:var(--mono);color:#5B6478} .extrait .el .m{font-family:var(--mono);text-align:right} .extrait .el .m.neg{color:#c0392b} .extrait .el .m.pos{color:#0d7a4b}
.extrait .eb{display:flex;justify-content:space-between;padding-top:8px;font-weight:700;font-family:var(--mono)}

const loyer = () => empl() ? empl().loyer : 0;
const garantie = () => loyer() * MOIS_GARANTIE;
const empruntMax = () => Math.floor(capital() * (1 - PART_PROPRE_MIN) / PART_PROPRE_MIN / 1000) * 1000;   // fonds propres ≥ 40 % du total
const empruntAccepte = () => S.emprunt != null && S.emprunt <= empruntMax();

const lum = (hex) => { const n = parseInt(hex.slice(1),16); return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255))/255; };
function setBrand(hex){
  const r = document.documentElement.style;
  if (!hex){ r.removeProperty("--brand"); r.removeProperty("--on-brand"); return; }
  r.setProperty("--brand", hex); r.setProperty("--on-brand", lum(hex) > .62 ? "#1D1F33" : "#FFFFFF");
}
function texteSurMarque(){
  const fond = S.couleur || "#2F6FED", c2 = S.couleur2;
  if (c2 && Math.abs(lum(c2) - lum(fond)) > .35) return c2;
  return lum(fond) > .62 ? "#1D1F33" : "#FFFFFF";
}

function genBCE(){
  const base = "1" + String(Math.floor(Math.random()*1e7)).padStart(7,"0");
  const n = base + String(97 - (parseInt(base,10) % 97)).padStart(2,"0");
  return `${n.slice(0,4)}.${n.slice(4,7)}.${n.slice(7)}`;
}
function mod97(str){ let r = 0; for (const ch of str) r = (r*10 + +ch) % 97; return r; }
function genIBAN(){
  const bank = ["001","063","068","310","363","523","732","751"][Math.floor(Math.random()*8)];
  const b10 = bank + String(Math.floor(Math.random()*1e7)).padStart(7,"0");
  const bban = b10 + String(mod97(b10) || 97).padStart(2,"0");
  const iban = "BE" + String(98 - mod97(bban + "111400")).padStart(2,"0") + bban;
  return iban.match(/.{1,4}/g).join(" ");
}

function bilanData(){
  const actif = [], passif = [];

  actif.push({ libelle:"Banque (trésorerie)", court:"Banque", montant:tresorerie(), rubrique:"Actif circulant" });
  passif.push({ libelle:"Capital", court:"Capital", montant:capital(), rubrique:"Fonds propres" });
  if (emprunt()) passif.push({ libelle:"Emprunt bancaire", court:"Emprunt", montant:emprunt(), rubrique:"Dettes à plus d'un an" });
  return { actif, passif, total: totalBilan() };
}

function bilanData(){
  const actif = [], passif = [];
  const frais = V1(fraisCreation), gar = V1(garantie), cap = V1(capital), emp = V1(emprunt);
  if (frais) actif.push({ libelle:"Frais d'établissement", court:"Frais d'établ.", montant:frais, rubrique:"Actif immobilisé" });
  BIENS.forEach(b => { const a = S.achats.find(x => x.fini && x.bien === b.id); if (a) actif.push({ libelle:`${b.rubrique} (${offreChoisie(a).fournisseur.nom})`, court:b.rubrique, montant:offreChoisie(a).totalHT, rubrique:"Actif immobilisé" }); });
  if (gar) actif.push({ libelle:"Garantie locative (créance)", court:"Garantie locative", montant:gar, rubrique:"Actif immobilisé" });
  if (tvaRecup()) actif.push({ libelle:"TVA à récupérer (créance sur l'État)", court:"TVA à récupérer", montant:tvaRecup(), rubrique:"Actif circulant" });
  actif.push({ libelle:"Banque (trésorerie)", court:"Banque", montant:banque(), rubrique:"Actif circulant" });
  passif.push({ libelle:"Capital", court:"Capital", montant:cap, rubrique:"Fonds propres" });
  if (resultat()) passif.push({ libelle:resultat() > 0 ? "Résultat de la période (escomptes obtenus)" : "Résultat de la période (perte : trop payé)", court:"Résultat", montant:resultat(), rubrique:"Fonds propres" });
  if (emp) passif.push({ libelle:"Emprunt bancaire", court:"Emprunt", montant:emp, rubrique:"Dettes à plus d'un an" });
  if (dettes()) passif.push({ libelle:"Dettes fournisseurs (à 30 jours)", court:"Dettes fourn.", montant:dettes(), rubrique:"Dettes à un an au plus" });
  const tA = r2(actif.reduce((s, l) => s + l.montant, 0)), tP = r2(passif.reduce((s, l) => s + l.montant, 0));
  return { actif, passif, total:tA, totalPassif:tP, equilibre: Math.abs(tA - tP) < 0.02 };
}

function genererFacture(a, k){
  const o = offreChoisie(a), f = o.fournisseur, d = new Date();

  Object.assign(fac, JSON.parse(JSON.stringify(base)));

    let type = o.remise > 0 ? "remise" : (o.livraison === 0 ? "livraison" : "quantite");
    if (type === "remise"){ fac.remise = 0; fac.remisePct = 0; }

    fac.erreur = { type, texte: ERREURS_FACTURE.find(e => e[0] === type)[1], surcoutTTC: r2(fac.totalTTC - base.totalTTC) };
  }

}

    const fin = () => { fini = true; clearTimeout(t); s.remove(); window[cb] = function(){}; setTimeout(() => { try { delete window[cb]; } catch(e) {} }, 120000); };
    const t = setTimeout(() => { if (!fini){ fin(); reject(new Error("timeout")); } }, timeout);
    window[cb] = (d) => { if (fini) return; fin(); resolve(d); };
    s.onerror = () => { if (!fini){ fin(); reject(new Error("reseau")); } };

    document.body.appendChild(s);
  });
}

      <div class="money-opts">${opts.map(b => { const reste = t - b, auto = c ? Math.floor(reste / c) : null; return `<button class="choice budget-opt ${S.budget === b ? "on" : ""}" data-budget="${b}"><b>${euro0(b)}</b><small>reste ${euro0(reste)} en banque<br>${auto != null ? auto + " mois d'autonomie" : ""}</small></button>`; }).join("")}</div>
      ${S.budget ? `<div class="note" style="margin:14px 0 0"><span class="i">📊</span><div>Avec ${euro0(S.budget)} d'achats payés comptant, il te resterait ${euro0(t - S.budget)}, soit <b>${Math.floor((t - S.budget) / c)} mois</b> de charges fixes. ${S.budget >= 4000 ? "Ambitieux : du matériel haut de gamme, mais moins de marge de sécurité." : S.budget <= 1500 ? "Prudent : tu devras choisir les offres les moins chères." : "Équilibré : de la qualité sans vider le compte."} Tu pourras aussi payer à 30 jours pour garder de la trésorerie.</div></div>` : ""}</div>`
    + nav(!!S.budget, "Choisis une enveloppe pour continuer.");
};

R.achat = () => { const a = A(), k = ETAPES[a.etape][0]; return achatTag() + subSteps(a) + R["ac_" + k](a); };

R.ac_bien = (a) => { const pris = S.achats.filter((x, j) => j !== S.i && x.bien).map(x => x.bien);
  return head(`Achat ${S.i + 1} · étape 1`, "Que vas-tu <span class='grad'>acheter</span> ?", "Trois investissements pour ouvrir. Dans l'ordre que tu veux.") + coach("bien")
    + `<div class="grid g3">${BIENS.map(b => { const done = pris.includes(b.id), on = a.bien === b.id; return `<button class="choice ${on ? "on" : ""} ${done ? "full" : ""}" data-bien="${b.id}" ${done ? 'aria-disabled="true"' : ""}><div class="ico">${b.icone}</div><h4>${esc(b.nom)}</h4><p>${esc(b.pourquoi)}</p><span class="tag">${esc(b.rubrique)} · actif immobilisé</span>${done ? `<span class="tag" style="color:var(--mint)">déjà acheté</span>` : ""}</button>`; }).join("")}</div>`
    + nav(!!a.bien, "Choisis le bien à acheter."); };

R.ac_methode = (a) => head(`Achat ${S.i + 1} · étape 2`, "Comment trouver <span class='grad'>trois offres</span> ?", `Pour ${esc(bien(a.bien).nom.toLowerCase())}, il te faut au moins trois offres de prix à comparer. Choisis ta méthode.`) + coach("methode")
  + `<div class="grid g2">${METHODES.map(m => `<button class="choice ${a.methode === m.id ? "on" : ""}" data-methode="${m.id}"><div class="ico">${m.icone}</div><h4>${esc(m.nom)}</h4><p>${esc(m.texte)}</p><span class="pro">${esc(m.pro)}</span><span class="con">${esc(m.con)}</span><span class="cost">⏱ ${esc(m.duree)}</span></button>`).join("")}</div>`
  + nav(!!a.methode, "Choisis une méthode.", {label:"Recevoir les offres"});

R.ac_offres = (a) => { const m = METHODES.find(x => x.id === a.methode), o = offreChoisie(a);
  let conseil = M2_COACH.offres;
  if (o && M1.strategie && o.niveau !== M1.strategie) conseil = `Tu avais choisi un positionnement <b>${esc(STRATEGIES.find(s => s.id === M1.strategie).nom.toLowerCase())}</b> et tu prends une offre <b>${esc(STRATEGIES.find(s => s.id === o.niveau).nom.toLowerCase())}</b>. Ce n'est pas interdit, mais explique-le dans tes raisons.`;
  else if (o && budgetRestant() - o.totalTTC < 0) conseil = `Attention : avec cette offre, tu dépasses ton budget de <b class="money">${euro(o.totalTTC - budgetRestant())}</b>. Tu peux continuer, mais le dépassement sera visible dans ton bilan… et par ton professeur.`;
  return head(`Achat ${S.i + 1} · étape 3`, "Compare les <span class='grad'>offres</span>", `${esc(m.recit)} Budget restant : <b class="money">${euro0(budgetRestant())}</b>.`) + coach("offres", conseil)
    + `<div class="offers">${a.offres.map((x, k) => offreCard(x, k, a)).join("")}</div>${comparatif(a)}
    ${o ? `<div class="card" style="margin-top:14px"><label class="f" style="margin-top:0">Pourquoi cette offre ? Une ou deux raisons :</label><div class="chips">${RAISONS_OFFRE.map(r => `<button class="chip ${a.raisons.includes(r) ? "on" : ""}" data-raison="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>` : ""}
    ${quiz("offres")}` + nav(a.choix != null && a.raisons.length >= 1, "Choisis une offre et au moins une raison.", {label:"Commander chez " + (o ? esc(o.fournisseur.nom) : "…")}); };

R.ac_commande = (a) => { const o = offreChoisie(a), solde = banque(), comptantOK = solde >= r2(o.totalTTC * (1 - ESCOMPTE));
  const ok = !!a.condition && a.verifBC && a.signBC.trim().length >= 3 && a.envoyeBC;
  return head(`Achat ${S.i + 1} · étape 4`, "Rédige ton <span class='grad'>bon de commande</span>", "Choisis tes conditions de paiement, vérifie chaque ligne, signe, envoie.") + coach("commande")
    + `<div class="card" style="margin-bottom:14px"><h3>Conditions de paiement</h3><div class="grid g2">
        <button class="choice ${a.condition === "comptant" ? "on" : ""} ${comptantOK ? "" : "full"}" data-cond="comptant" ${comptantOK ? "" : 'aria-disabled="true"'}><div class="ico">⚡</div><h4>Comptant à la livraison</h4><p>Tu paies dès réception. Le fournisseur t'accorde <b>2 % d'escompte</b>.</p><span class="pro">Tu économises ${euro(r2(o.totalTTC * ESCOMPTE))}</span><span class="con">${euro(r2(o.totalTTC * (1 - ESCOMPTE)))} sortent tout de suite de la banque</span>${comptantOK ? "" : `<span class="tag" style="color:var(--coral)">Solde insuffisant (${euro0(solde)}) : la banque refuserait le virement</span>`}</button>
        <button class="choice ${a.condition === "30j" ? "on" : ""}" data-cond="30j"><div class="ico">📅</div><h4>À 30 jours</h4><p>Le fournisseur te fait crédit : tu paies le mois prochain, prix plein.</p><span class="pro">Ta trésorerie reste disponible</span><span class="con">Une dette fournisseur de ${euro(o.totalTTC)} apparaît au passif</span></button></div></div>
      ${bonDeCommande(a)}
      <div class="checks" style="margin-top:14px">
        <label class="check ${a.verifBC ? "ok" : ""}"><input type="checkbox" data-chk="verifBC" ${a.verifBC ? "checked" : ""}><span>J'ai vérifié : fournisseur, référence <b>${esc(o.ref)}</b>, prix HT <b>${euro(o.prixHT)}</b>${o.remise ? ", remise " + o.remisePct + " %" : ""}, livraison ${o.livraison ? euro(o.livraison) : "gratuite"}, total TTC <b>${euro(o.totalTTC)}</b>, conditions de paiement.</span></label>
        <label class="check ${a.envoyeBC ? "ok" : ""}"><input type="checkbox" data-chk="envoyeBC" ${a.envoyeBC ? "checked" : ""}><span>J'envoie le bon de commande signé par e-mail à <b>${esc(o.fournisseur.web.replace("www.", "commandes@"))}</b> et j'en garde une copie.</span></label></div>`
    + nav(ok, "Conditions, vérification, signature et envoi sont obligatoires.", {label:"Envoyer la commande"}); };

R.ac_livraison = (a) => { const o = offreChoisie(a), ok = a.checks.every(Boolean) && a.signBL.trim().length >= 3;
  return head(`Achat ${S.i + 1} · étape 5`, "Réceptionne la <span class='grad'>livraison</span>", "Le colis est là. Vérifie avant de signer.") + coach("livraison")
    + `<div class="sms"><div class="from"><span>${esc(o.fournisseur.nom)} · SMS et e-mail</span><span>${esc(a.notif.date)}</span></div>Bonjour ${esc(S.eleve.prenom)}, votre commande <b>${esc(a.bc.numero)}</b> est confirmée. Livraison prévue le <b>${esc(a.notif.livraison)}</b> entre 9 h et 12 h. Merci de votre confiance !</div>

      <div class="checks" style="margin-top:14px">
        ${[`C'est bien l'article commandé : <b>${esc(o.article)}</b>, réf. ${esc(o.ref)}`, "La quantité livrée correspond à la quantité commandée : <b>1</b>", "Le colis est en bon état, rien n'est cassé ni manquant"].map((t, i) => `<label class="check ${a.checks[i] ? "ok" : ""}"><input type="checkbox" data-chk="checks.${i}" ${a.checks[i] ? "checked" : ""}><span>${t}</span></label>`).join("")}</div>`
    + nav(ok, "Trois vérifications et une signature.", {label:"Accepter la livraison"}); };

R.ac_facture = (a) => { const f = a.facture, o = offreChoisie(a), decided = !!a.decision, bonneReponse = f.erreur && a.decision === "contestee" && a.erreurChoisie === f.erreur.type;
  let verdict = "";
  if (decided){
    if (!f.erreur && a.decision === "acceptee") verdict = `<div class="note ok"><span class="i">✅</span><div><b>Facture conforme.</b> Elle correspond au bon de commande et au bon de livraison : tu peux la payer.</div></div>`;
    else if (!f.erreur && a.decision === "contestee") verdict = `<div class="note warn"><span class="i">📩</span><div><b>Le fournisseur a vérifié : la facture est correcte.</b> Pas de note de crédit. Contester sans raison fait perdre du temps à tout le monde… mais mieux vaut ça que payer trop.</div></div>`;
    else if (bonneReponse) verdict = `<div class="note ok"><span class="i">🦅</span><div><b>Bien vu !</b> ${esc(f.erreur.texte)} : ${euro(f.erreur.surcoutTTC)} de trop. Le fournisseur t'envoie une note de crédit. Reste dû : <b class="money">${euro(f.correct.totalTTC)}</b>.</div></div>`;
    else if (f.erreur && a.decision === "contestee") verdict = `<div class="note warn"><span class="i">📩</span><div><b>Tu as contesté, mais pas la bonne ligne.</b> Le fournisseur a quand même retrouvé l'erreur : ${esc(f.erreur.texte.toLowerCase())}. Note de crédit de ${euro(f.erreur.surcoutTTC)}. La prochaine fois, compare ligne par ligne.</div></div>`;
    else verdict = `<div class="note bad"><span class="i">💸</span><div><b>Tu as accepté une facture erronée.</b> ${esc(f.erreur.texte)} : tu vas payer <b class="money">${euro(f.erreur.surcoutTTC)}</b> de trop. En comptabilité, c'est une perte. Compare toujours la facture au bon de commande.</div></div>`;
  }
  return head(`Achat ${S.i + 1} · étape 6`, "Contrôle la <span class='grad'>facture</span>", `La facture de ${esc(o.fournisseur.nom)} est arrivée. Compare-la avec ton bon de commande (${euro(o.totalTTC)} TTC) et ton bon de livraison.`) + coach("facture")
    + `<div class="grid g2" style="align-items:start"><div>${facture(a, {marque:decided})}</div>
      <div><div class="card tight"><h3>Rappel de ta commande ${esc(a.bc.numero)}</h3><table class="led"><tbody><tr><td>Article</td><td class="n">1 × ${esc(o.ref)}</td></tr><tr><td>Prix HT</td><td class="n">${euro(o.prixHT)}</td></tr><tr><td>Remise</td><td class="n">${o.remise ? "− " + euro(o.remise) : "aucune"}</td></tr><tr><td>Livraison</td><td class="n">${o.livraison ? euro(o.livraison) : "gratuite"}</td></tr><tr><td>Total HT</td><td class="n">${euro(o.totalHT)}</td></tr><tr><td>TVA 21 %</td><td class="n">${euro(o.tva)}</td></tr><tr class="tot"><td>Total TTC</td><td class="n">${euro(o.totalTTC)}</td></tr></tbody></table><p class="help">Livré : 1 article, colis conforme (BL ${esc(a.bl.numero)}).</p></div>
        ${decided ? "" : `<div class="decision"><button class="btn btn-ghost" data-act="accepter" style="justify-content:center;border-color:rgba(52,211,153,.6)">✓ Conforme, j'accepte</button><button class="btn btn-ghost" data-act="contester" style="justify-content:center;border-color:rgba(251,113,133,.6)">✗ Je conteste</button></div>`}
        ${!decided && a.decision === null && a.contestation ? `<div class="card tight" style="margin-top:12px"><h3>Qu'est-ce qui cloche ?</h3><div class="chips">${ERREURS_FACTURE.map(e => `<button class="chip" data-err="${e[0]}">${esc(e[1])}</button>`).join("")}</div></div>` : ""}
        ${verdict}</div></div>
    ${a.nc ? `<div style="margin-top:14px">${noteDeCredit(a)}</div>` : ""}
    ${decided ? quiz("facture") : ""}`
    + nav(decided, "Accepte ou conteste la facture.", {label: a.condition === "comptant" ? "Passer au paiement" : "Enregistrer la dette"}); };

R.ac_paiement = (a) => { const o = offreChoisie(a), comptant = a.condition === "comptant", due = montantFacture(a);
  return head(`Achat ${S.i + 1} · étape 7`, comptant ? "Paie par <span class='grad'>virement</span>" : "Enregistre ta <span class='grad'>dette</span>", comptant ? `Montant dû ${euro(due)} TTC, moins 2 % d'escompte : <b class="money">${euro(montantPaye(a))}</b>.` : `Rien ne sort aujourd'hui : tu dois <b class="money">${euro(due)}</b> à ${esc(o.fournisseur.nom)} pour le ${esc(a.facture.echeance)}.`) + coach("paiement")
    + (a.fini ? `${comptant ? extraitCompte(a) : `<div class="note gold"><span class="i">📅</span><div><b>Dette fournisseur enregistrée.</b> ${euro(due)} à payer le ${esc(a.facture.echeance)}. Ta banque n'a pas bougé : ${euro(banque())}. Mais au passif, une dette est apparue : il faudra la trésorerie à l'échéance.</div></div>`}${ecriture(a)}`
      : `<div class="card"><h3>${comptant ? "Ordre de virement" : "Facture à payer"}</h3><table class="led"><tbody><tr><td>Bénéficiaire</td><td class="n">${esc(o.fournisseur.nom)} ${esc(o.fournisseur.forme)}</td></tr><tr><td>Communication</td><td class="n">${esc(a.facture.numero)}</td></tr><tr><td>Montant facturé TTC</td><td class="n">${euro(due)}</td></tr>${comptant ? `<tr><td>Escompte 2 %</td><td class="n pos">− ${euro(escompteDe(a))}</td></tr><tr class="tot"><td>Montant du virement</td><td class="n">${euro(montantPaye(a))}</td></tr>` : `<tr class="tot"><td>Échéance</td><td class="n">${esc(a.facture.echeance)}</td></tr>`}</tbody></table>
        <div class="nav" style="margin-top:14px"><span class="help">Solde actuel : ${euro(banque())}</span><button class="btn btn-main" data-act="payer">${comptant ? "Confirmer le virement" : "Enregistrer la facture à payer"}</button></div></div>`)
    + (a.fini ? nav(true, "", {label: achatsRecus().length < CONFIG.NB_ACHATS ? "Achat suivant" : "Voir mon bilan"}) : ""); };

R.bilan = () => { const d = bilanData(), t = tresoDepart(), ok = !!S.done.bilan;
  return head("Dernière étape", "Ton <span class='grad'>bilan</span> après équipement", `Au jour de la fondation : ${euro0(V1(totalBilan))} de bilan, ${euro0(t)} en banque. Aujourd'hui, les trois achats ont transformé ta trésorerie en actif immobilisé.`) + coach("bilan")
    + `<div class="m2-stats"><div class="stat"><b>${euro0(banque())}</b><span>en banque</span></div><div class="stat"><b>${euro0(tvaRecup())}</b><span>TVA à récupérer</span></div><div class="stat"><b style="color:${dettes() ? "var(--amber)" : "var(--mint)"}">${euro0(dettes())}</b><span>dettes fournisseurs</span></div><div class="stat"><b style="color:${resultat() >= 0 ? "var(--mint)" : "var(--coral)"}">${resultat() >= 0 ? "+" : "−"} ${euro(Math.abs(resultat()))}</b><span>résultat (escomptes − pertes)</span></div></div>
    ${bilanHTML()}
    <div class="note" style="margin-top:14px"><span class="i">🎓</span><div>Tes achats sont à l'actif immobilisé pour leur valeur <b>hors TVA</b> : la TVA, elle, est une créance sur l'État. ${dettes() ? `Les factures à 30 jours sont au passif, en <b>dettes à un an au plus</b>. ` : ""}${resultat() ? `Le <b>résultat</b> apparaît déjà dans les fonds propres : ${resultat() > 0 ? "tes escomptes sont un gain" : "ce que tu as payé en trop est une perte"}. ` : ""}Budget ${budgetRespecte() ? `respecté : ${euro0(engage())} engagés sur ${euro0(S.budget)} ✔` : `dépassé : ${euro0(engage())} engagés pour ${euro0(S.budget)} prévus.`}</div></div>
    ${quiz("bilan")}`
    + nav(d.equilibre, "Le bilan n'est pas équilibré : préviens ton professeur.", {label: ok ? "Terminer la mission 🚀" : "Valider mon bilan", act: ok ? "send" : "validerBilan"}); };

R.fin = () => { const lecture = MODE === "consultation", e = S.envoi || {}, defis = Object.values(S.quiz).filter(q => q.ok).length;
  const status = lecture ? `<div class="status ok">🔒 Ta mission 2 est enregistrée chez ton professeur. Tes achats sont définitifs.</div>` : e.mode === "ok" ? `<div class="status ok">✓ Mission enregistrée chez ton professeur.</div>` : e.mode === "ferme" ? `<div class="status err">L'accès a été fermé avant l'envoi. Demande à ton professeur de rouvrir, puis <button class="btn btn-ghost" data-act="resend" style="padding:8px 16px;font-size:14px">Réessayer l'envoi</button></div>` : e.mode === "err" ? `<div class="status err">L'envoi n'a pas pu être confirmé. <button class="btn btn-ghost" data-act="resend" style="padding:8px 16px;font-size:14px">Réessayer l'envoi</button></div>` : `<div class="status wait"><span class="spin"></span>Enregistrement chez ton professeur en cours…</div>`;
  return `<div class="hero" style="padding-top:6px"><div class="kick">Mission 2 ${lecture ? "terminée" : "accomplie"}</div><h2 style="font-size:clamp(32px,4.8vw,54px)"><span class="grad">${esc(V1(deno))}</span> est équipée.</h2><p class="lead">Mobilier, caisse, ordinateur : tout est là, payé ou à payer, et ta comptabilité est à jour. Bravo ${esc(S.eleve.prenom)}.</p></div>${status}
    <div class="stats"><div class="stat"><b>${S.xp}</b><span>XP gagnés</span></div><div class="stat"><b style="font-family:var(--display);font-size:20px;padding:4px 0">${esc(niv())}</b><span>Ton niveau</span></div><div class="stat"><b>${M2_BADGES.filter(b => S.done["b_" + b[0]]).length}/${M2_BADGES.length}</b><span>Badges</span></div><div class="stat"><b>${defis}/${Object.keys(M2_QUIZ).length}</b><span>Défis éclair réussis</span></div></div>
    <div class="duo"><div class="front-wrap">${V1(() => vitrine("fin"))}</div><div><div class="card tight"><h3>Ton équipement</h3>${S.achats.map(a => { const o = offreChoisie(a), b = bien(a.bien); return `<div class="fourn" style="margin-bottom:8px"><div class="fi">${b.icone}</div><div><b>${esc(o.article)}</b><br><span class="help" style="margin:0">${esc(o.fournisseur.nom)} · ${euro(o.totalHT)} HT · ${a.condition === "comptant" ? "payé comptant" : "à payer le " + esc(a.facture.echeance)}</span></div></div>`; }).join("")}</div></div></div>
    <div class="card" style="margin-top:22px"><h3 class="sub" style="margin-top:0">Journal des achats</h3><table class="led journal"><thead><tr><th>Date</th><th>Fournisseur</th><th>Pièce</th><th class="n">HT</th><th class="n">TVA</th><th class="n">TTC</th><th>Paiement</th></tr></thead><tbody>${S.achats.map(a => { const o = offreChoisie(a); return `<tr><td>${esc(a.facture.date)}</td><td>${esc(o.fournisseur.nom)}</td><td class="money">${esc(a.facture.numero)}${a.nc ? " + NC" : ""}</td><td class="n">${euro(o.totalHT)}</td><td class="n">${euro(o.tva)}</td><td class="n">${euro(montantFacture(a))}</td><td>${a.paye ? "✓ payé " + euro(montantPaye(a)) : "📅 " + esc(a.facture.echeance)}</td></tr>`; }).join("")}<tr class="tot"><td colspan="3">Total</td><td class="n">${euro(r2(S.achats.reduce((s, a) => s + offreChoisie(a).totalHT, 0)))}</td><td class="n">${euro(tvaRecup())}</td><td class="n">${euro(r2(S.achats.reduce((s, a) => s + montantFacture(a), 0)))}</td><td></td></tr></tbody></table></div>
    <h3 class="sub">Ton bilan après équipement</h3>${bilanHTML()}
    <div class="card" style="margin-top:22px"><h3 class="sub" style="margin-top:0">Tes badges</h3><div class="badges">${M2_BADGES.map(b => `<div class="badge ${S.done["b_" + b[0]] ? "" : "lockd"}"><div class="i">${S.done["b_" + b[0]] ? b[1] : "🔒"}</div><b>${esc(b[2])}</b></div>`).join("")}</div>
      <h3 class="sub">Ton carnet de mots de pro</h3><div class="words">${S.mots.map(m => `<div class="word"><b>${esc(M2_MOTS[m].mot)}</b><span>${esc(M2_MOTS[m].def)}</span></div>`).join("")}</div>
      <div class="nav" style="margin-top:22px"><button class="btn btn-ghost" data-act="print">Imprimer mon dossier d'achats</button></div></div>
    <div class="next"><div class="ic">🛍️</div><div><b>Prochaine mission : ta première commande client.</b><br><span class="help" style="margin:0">Il va falloir acheter de la marchandise, fixer un prix de vente avec une marge, livrer, facturer… et encaisser. ${dettes() ? "Sans oublier de payer tes fournisseurs à l'échéance." : ""}</span></div></div>`; };

// ======================================================================
//  COQUILLE : barre des phases, tableau de bord, barre du haut
// ======================================================================
const PHASES = () => [["budget","Budget"], ["a0","Achat 1"], ["a1","Achat 2"], ["a2","Achat 3"], ["bilan","Bilan"]];
const phaseCourante = () => S.phase === "achats" ? "a" + S.i : S.phase;
function stepsStrip(){
  if (MODE !== "mission") return "";
  const cur = phaseCourante(), ordre = PHASES().map(p => p[0]), ic = ordre.indexOf(cur);
  return `<div class="steps">${PHASES().map((p, k) => { const cls = k < ic ? "done" : k === ic ? "now" : ""; return `<span class="stp ${cls}"><span class="n">${k < ic ? "✓" : k + 1}</span><span class="lab">${p[1]}</span></span>`; }).join("")}</div>
    <div class="steps-bar"><i style="width:${Math.round(ic / (ordre.length - 1) * 100)}%"></i></div>`;
}
function renderRail(){ $("#rail").innerHTML = ""; }
function renderSide(){
  const side = $("#side"), layout = $("#layout");
  if (MODE !== "mission"){ side.innerHTML = ""; layout.classList.add("solo"); return; }
  layout.classList.remove("solo");
  const t = TYPES.find(x => x.id === M1.typeId), b = banque(), a = autonomieNow();
  const pct = S.budget ? Math.min(100, Math.round(engage() / S.budget * 100)) : 0;
  side.innerHTML = `<div class="dash"><div class="front-wrap">${V1(() => vitrine("side"))}</div>
    <div class="box"><h3>Mon entreprise <b>${esc(V1(deno))}</b></h3>
      <div class="srow"><span class="k">Activité</span><span class="v">${t ? t.emoji + " " + esc(t.nom) : ""}</span></div>
      <div class="srow"><span class="k">Positionnement</span><span class="v">${M1.strategie ? esc(STRATEGIES.find(s => s.id === M1.strategie).nom) : "–"}</span></div>
      <div class="m3" style="margin-top:10px"><div>Banque<b style="color:${b < 0 ? "var(--coral)" : "var(--mint)"}">${euro0(b)}</b></div><div>Dettes fourn.<b>${euro0(dettes())}</b></div><div>Autonomie<b style="color:${a == null ? "" : a < 3 ? "var(--coral)" : a < 6 ? "var(--amber)" : "var(--mint)"}">${a == null ? "–" : a + " mois"}</b></div></div>
      ${S.budget ? `<div class="help" style="margin-top:10px;display:flex;justify-content:space-between"><span>Budget engagé</span><b class="money" style="color:${engage() > S.budget ? "var(--coral)" : "var(--text)"}">${euro0(engage())} / ${euro0(S.budget)}</b></div><div class="bgauge"><i style="width:${pct}%"></i></div>` : ""}
      <div class="equip">${BIENS.map(x => { const ach = S.achats.find(z => z.bien === x.id), cur = S.phase === "achats" && A().bien === x.id && !A().fini; return `<div class="${ach && ach.fini ? "ok" : cur ? "cur" : ""}"><b>${ach && ach.fini ? x.icone : cur ? "⏳" : "▫️"}</b>${esc(x.court)}</div>`; }).join("")}</div></div></div>`;
}
function updateTop(){
  const enMission = MODE === "mission" || MODE === "consultation";
  $("#xpBox").hidden = !enMission; $("#xpBox").innerHTML = `${S.xp} XP <small>· ${esc(niv())}</small>`;
  $("#who").innerHTML = MODE !== "login" && S.eleve.email ? `<b>${esc(S.eleve.prenom)} ${esc(S.eleve.nom)}</b><button data-act="logout">Changer de compte</button>` : "";
  const mk = $("#mark");
  if (enMission && M1 && M1.symbole){ mk.className = "mark emo"; mk.textContent = M1.symbole; } else { mk.className = "mark"; mk.textContent = "SL"; }
  $("#topTitle").childNodes[0].textContent = enMission && M1 ? V1(deno) : "Équipe ton entreprise";
  $("#topSub").textContent = MODE === "consultation" ? "Mission 2 accomplie" : MODE === "mission" ? (S.phase === "achats" ? `Mission 2 · achat ${S.i + 1}/${CONFIG.NB_ACHATS} · ${ETAPES[A().etape][1].toLowerCase()}` : "Mission 2 · " + (S.phase === "budget" ? "budget" : "bilan")) : "Mission 2 · Institut Saint-Luc de Frameries";
  const k = $("#kpis");
  if (!enMission || !M1){ k.innerHTML = ""; return; }
  k.innerHTML = `<div class="kpi ${banque() < 0 ? "bad" : "ok"}"><span>Banque</span><b>${euro0(banque())}</b></div><div class="kpi ${dettes() ? "warn" : ""}"><span>Dettes fournisseurs</span><b>${euro0(dettes())}</b></div><div class="kpi ${S.budget != null && engage() > S.budget ? "bad" : ""}"><span>Budget restant</span><b>${S.budget != null ? euro0(budgetRestant()) : "–"}</b></div>`;
}

// ======================================================================
//  CONNEXION, NAVIGATION
// ======================================================================
const ERREURS = { email_invalide:"Cette adresse n'est pas valide (prenom.nom@istlm.org).", non_inscrit:"Cette adresse n'est pas sur la liste de ta classe.", reseau:"Impossible de joindre le serveur. Vérifie ta connexion.", timeout:"Le serveur Google ne répond pas. Patiente quelques secondes, puis réessaie." };
async function seConnecter(email){
  LOGIN.busy = true; LOGIN.err = ""; LOGIN.lent = false; render();
  SESSION.email = email;
  const lent = setTimeout(() => { if (LOGIN.busy){ LOGIN.lent = true; render(); } }, 6000);
  let r;
  try { r = await connexion(); } catch(e) { clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false; LOGIN.err = e.message === "timeout" ? ERREURS.timeout : ERREURS.reseau; render(); return; }
  clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false;
  if (!r || !r.ok){ LOGIN.err = ERREURS[r && r.erreur] || "Connexion refusée. Demande à ton professeur."; render(); return; }
  appliquerConnexion(r, email);
}
function appliquerConnexion(r, email){
  SESSION.diag = r.diagnostic || null; SESSION.reouvert = false;
  const d = r.dossier, m1 = d && d.missions ? d.missions["1"] : null, m2 = d && d.missions ? d.missions["2"] : null;
  const id = Object.assign({email}, nomDepuisEmail(email), {classe:CONFIG.CLASSE_DEFAUT});
  [d && d.eleve, r.eleve].forEach(s => { if (s) ["prenom","nom","classe"].forEach(k => { if (s[k] && String(s[k]).trim()) id[k] = String(s[k]).trim(); }); });
  M1 = d ? normaliser(d) : null;
  if (!M1 || !m1 || m1.statut !== "termine"){ S = fresh(); S.eleve = id; SESSION.bloque = "m1"; MODE = "bloque"; render(true); return; }
  if (M1.ancien || !M1.apport || !M1.emplacement){ S = fresh(); S.eleve = id; SESSION.bloque = "ancien"; MODE = "bloque"; render(true); return; }
  M1.eleve = { prenom:id.prenom, nom:id.nom, email };
  const serveur = m2 && m2.etatApp && m2.etatApp.v === 4 ? m2.etatApp : null, local = lireLocal(email);
  if (r.statut === "termine" && serveur){ S = restaurer(serveur); MODE = "consultation"; S.phase = "fin"; S.envoi = {mode:"ok"}; }
  else if (r.statut === "termine"){ S = restaurer(null); MODE = "ancien"; }
  else if (!r.ouvert){ S = restaurer(serveur || local); MODE = "ferme"; }
  else if (r.statut === "reinitialise"){ S = restaurer(null); S.briefing = true; SESSION.reouvert = true; MODE = "mission"; }
  else if (r.statut === "en_cours"){ const dernier = m2.dernier_envoi ? Date.parse(m2.dernier_envoi) : 0; S = restaurer(local && local.majLocale > dernier ? local : serveur); MODE = "mission"; }
  else { S = restaurer(local && local.phase !== "fin" ? local : null); MODE = "mission"; }
  S.eleve = id;
  if (!S.startedAt) S.startedAt = Date.now();
  if (MODE === "mission" && S.phase === "fin") S.phase = "bilan";
  if (MODE === "mission" && !S.briefing) MODE = "briefing";
  save(); render(true);
}
R.ancien = () => `<div class="hero" style="text-align:center;margin:0 auto"><div style="font-size:60px">🗂️</div><h2 style="max-width:none">Mission déjà terminée</h2><p class="lead" style="margin:0 auto">Ta mission 2 a été faite avec une ancienne version. Elle est enregistrée chez ton professeur ; demande-lui une réinitialisation pour la refaire avec celle-ci.</p></div>`;
async function verifierOuvert(){
  try { const r = await jsonp({action:"ping", mission:CONFIG.MISSION}, 10000); if (r && r.diagnostic) SESSION.diag = r.diagnostic; return !!(r && r.acces && (r.missionsOuvertes || []).indexOf(CONFIG.MISSION) >= 0); } catch(e) { return true; }
}
async function controlerEnFond(){ if (pingAutorise() && !(await verifierOuvert())){ annulerSauvegardePrevue(); if (MODE === "mission"){ MODE = "ferme"; save(); render(true); } } }

/** Passage à l'étape suivante d'un achat (ou à la phase suivante). */
function suivant(){
  if (S.phase === "budget"){ if (!S.budget) return; award("budget", 100, "budget"); unlockMots(["budget","investissement"]); S.phase = "achats"; S.i = 0; save(); render(true); sauvegarder(true); controlerEnFond(); return; }
  if (S.phase === "achats"){
    const a = A(), k = ETAPES[a.etape][0], n = S.i;
    if (k === "bien"){ if (!a.bien) return; a.etape = 1; }
    else if (k === "methode"){ if (!a.methode) return; a.offres = genererOffres(a.bien); a.etape = 2; unlockMots(["offre"]); }
    else if (k === "offres"){ if (a.choix == null || !a.raisons.length) return; award("compare" + n, 50, "compare"); unlockMots(n === 0 ? ["httc","immobilisation"] : []); a.etape = 3; }
    else if (k === "commande"){ if (!(a.condition && a.verifBC && a.signBC.trim().length >= 3 && a.envoyeBC)) return;
      const o = offreChoisie(a); a.bc = { numero:`BC-${ANNEE()}-00${n + 1}`, date:today() }; a.notif = { date:today(), livraison:jourLong(plusJours(o.delai)) }; a.bl = { numero:`BL-${o.fournisseur.code}-${String(hash(S.eleve.email + o.numero) % 90000 + 10000)}`, date:dateFr(plusJours(o.delai)) };
      award("bc" + n, 50, "bc"); unlockMots(["bc", a.condition === "30j" ? "credit" : "escompte"]); if (a.condition === "30j") award("credit", 0, "credit"); a.etape = 4; }
    else if (k === "livraison"){ if (!(a.checks.every(Boolean) && a.signBL.trim().length >= 3)) return;
      a.facture = genererFacture(a, n); award("bl" + n, 50, "bl"); unlockMots(["bl"]); a.etape = 5; }
    else if (k === "facture"){ if (!a.decision) return; award("fact" + n, 50, "facture"); unlockMots(["facture", a.nc ? "nc" : "tvaDed"]); a.etape = 6; }
    else if (k === "paiement"){ if (!a.fini) return;
      if (achatsRecus().length >= CONFIG.NB_ACHATS){ S.phase = "bilan"; } else { S.i = S.achats.findIndex(x => !x.fini); }
    }
    save(); render(true); sauvegarder(k === "paiement" || k === "commande"); controlerEnFond(); return;
  }
}
function payer(){
  const a = A(); if (a.fini) return;
  a.fini = true; a.payeLe = today();
  if (a.condition === "comptant"){ a.paye = true; a.extrait = genererExtrait(a); award("paye" + S.i, 50, "paye"); unlockMots(["extrait"]); }
  else { a.paye = false; award("dette" + S.i, 50, "credit"); unlockMots(["dettes"]); }
  save(); render(); sauvegarder(true);
}
async function envoyerFinal(){
  annulerSauvegardePrevue(); S.finishedAt = Date.now(); S.phase = "fin"; S.envoi = {mode:"wait"}; save();
  setTimeout(() => { render(true); confetti(); }, 400);
  await envoyer("termine"); await confirmerEnvoi();
}
async function confirmerEnvoi(){
  for (let i = 0; i < 4; i++){ await wait(2000 + i*1500);
    try { const r = await connexion(); if (r && r.ok && r.statut === "termine"){ S.envoi = {mode:"ok"}; save(); render(); return; } if (r && r.ok && !r.ouvert){ S.envoi = {mode:"ferme"}; save(); render(); return; } } catch(e) {} }
  S.envoi = {mode:"err"}; save(); render();
}
function render(scroll){
  setBrand(MODE === "login" || !M1 ? null : M1.couleur);
  const key = MODE === "login" ? "login" : MODE === "ferme" ? "ferme" : MODE === "bloque" ? "bloque" : MODE === "ancien" ? "ancien" : MODE === "briefing" ? "briefing" : MODE === "consultation" ? "fin" : S.phase === "budget" ? "budget" : S.phase === "achats" ? "achat" : S.phase === "bilan" ? "bilan" : "fin";
  $("#main").innerHTML = (key === "budget" || key === "achat" || key === "bilan" ? stepsStrip() : "") + R[key]();
  updateTop(); renderRail(); renderSide();
  if (MODE === "login"){ const em = $("#em"); if (em && !LOGIN.busy) em.focus(); }
  if (scroll) window.scrollTo({top:0, behavior:"smooth"});
}
function setPath(obj, path, val){ const p = path.split("."); let o = obj; while (p.length > 1) o = o[p.shift()]; o[p[0]] = val; }
function refreshLive(){
  if (MODE !== "mission" || S.phase !== "achats") return;
  const a = A(), k = ETAPES[a.etape][0];
  const ok = k === "commande" ? !!(a.condition && a.verifBC && a.signBC.trim().length >= 3 && a.envoyeBC) : k === "livraison" ? (a.checks.every(Boolean) && a.signBL.trim().length >= 3) : null;
  if (ok == null) return;
  document.querySelectorAll('[data-act="next"]').forEach(b => b.disabled = !ok);
  const hint = $("#main .nav .hint"); if (hint) hint.style.visibility = ok ? "hidden" : "visible";
  document.querySelectorAll(".check").forEach(c => c.classList.toggle("ok", c.querySelector("input").checked));
}
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "em"){ LOGIN.email = el.value; const b = $('[data-act="login"]'); if (b) b.disabled = !emailOk(el.value.trim().toLowerCase()); return; }
  if (MODE !== "mission" || !el.dataset.bind) return;
  A()[el.dataset.bind] = el.value; save(); refreshLive();
});
document.addEventListener("change", (e) => {
  const el = e.target; if (MODE !== "mission" || !el.dataset.chk) return;
  if (el.dataset.chk.startsWith("checks.")) A().checks[+el.dataset.chk.split(".")[1]] = el.checked; else A()[el.dataset.chk] = el.checked;
  save(); refreshLive();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("#modal").hidden = true;
  if (e.key === "Enter" && e.target.id === "em"){ const b = $('[data-act="login"]'); if (b && !b.disabled) b.click(); }
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "d"){ const m = $("#modal"); m.innerHTML = `<div class="box" role="dialog"><h3>Données de la mission (format envoyé au Google Sheet)</h3><pre>${esc(JSON.stringify(S.lastPayload || (M1 ? payload("apercu") : {}), null, 2))}</pre><button class="btn btn-main" data-act="close">Fermer</button></div>`; m.hidden = false; }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const act = b.dataset.act;
  if (act === "login"){ const em = LOGIN.email.trim().toLowerCase(); if (emailOk(em)) seConnecter(em); return; }
  if (act === "retry"){ seConnecter(S.eleve.email || SESSION.email); return; }
  if (act === "logout"){ save(); MODE = "login"; LOGIN = {email:"", busy:false, err:"", lent:false}; S = fresh(); M1 = null; render(true); return; }
  if (act === "close"){ $("#modal").hidden = true; return; }
  if (act === "brief"){ S.briefing = true; MODE = "mission"; save(); render(true); return; }
  if (act === "print"){ $("#print-area").innerHTML = S.achats.map(a => facture(a)).join("") + `<div class="paper" style="margin-top:8mm"><div class="ph"><div><h4>Bilan de ${esc(V1(deno))} après équipement</h4><small>${esc(today())}</small></div></div>${bilanHTML({foot:false})}</div>`; window.print(); return; }
  if (act === "resend"){ S.envoi = {mode:"wait"}; render(); envoyer("termine").then(confirmerEnvoi); return; }
  if (MODE !== "mission") return;
  if (b.dataset.budget){ S.budget = +b.dataset.budget; save(); render(); return; }
  if (b.dataset.quiz){ const k = b.dataset.quiz; if (S.quiz[k]) return; const ok = +b.dataset.i === M2_QUIZ[k].ok; S.quiz[k] = { rep:+b.dataset.i, ok };
    if (ok){ S.xp += 50; toast("<b>+50 XP</b><div>⚡ Défi éclair réussi</div>"); } else toast("<div>Raté, mais lis l'explication : c'est ça qui compte.</div>"); save(); render(); return; }
  if (S.phase === "achats"){
    const a = A();
    if (b.dataset.bien){ if (S.achats.some((x, j) => j !== S.i && x.bien === b.dataset.bien)) return; a.bien = b.dataset.bien; save(); render(); return; }
    if (b.dataset.methode){ a.methode = b.dataset.methode; save(); render(); return; }
    if (b.dataset.choix != null){ a.choix = +b.dataset.choix; save(); render(); return; }
    if (b.dataset.raison){ const r = b.dataset.raison, i = a.raisons.indexOf(r); if (i >= 0) a.raisons.splice(i, 1); else if (a.raisons.length < 2) a.raisons.push(r); else { toast("<div>Deux raisons maximum.</div>"); return; } save(); render(); return; }
    if (b.dataset.cond){ if (b.getAttribute("aria-disabled") === "true"){ toast("<div>Solde insuffisant pour payer comptant : choisis le paiement à 30 jours.</div>"); return; } a.condition = b.dataset.cond; save(); render(); return; }
    if (act === "accepter"){ a.decision = "acceptee"; a.contestation = false; save(); render(); return; }
    if (act === "contester"){ a.contestation = true; save(); render(); return; }
    if (b.dataset.err){ a.erreurChoisie = b.dataset.err; a.decision = "contestee"; a.contestation = false;
      if (a.facture.erreur){ const o = offreChoisie(a); a.nc = { numero:`NC-${o.fournisseur.code}-${ANNEE()}-${String(hash(a.facture.numero) % 900 + 100)}`, date:today() };
        if (a.erreurChoisie === a.facture.erreur.type){ S.xp += 75; S.done["b_lynx"] = true; toast("<b>+75 XP</b><div>🦅 Badge débloqué : Œil de lynx</div>"); } }
      save(); render(); return; }
    if (act === "payer"){ payer(); return; }
  }
  if (act === "validerBilan"){ award("bilan", 100, "bilan"); if (budgetRespecte()) award("dansBudget", 100, "dansBudget"); save(); render(); return; }
  switch (act){ case "next": suivant(); break; case "send": envoyerFinal(); break; }
});
render();
</script>
