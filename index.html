      poser(papier, "afterbegin", "entete", () => enteteFournisseur(o, a.bl ? a.bl.numero : ""));
      poser(papier, "beforeend", "mention", COMPTA.mention);
      const sig = papier.querySelector(".sigline"), complet = a.checks.every(Boolean) && String(a.signBL).trim().length >= 3;
      const zone = sig && poser(sig, "afterbegin", "cachets", `<span class="m2-cachets" aria-hidden="true"></span>`);
      tampon(zone, "recu", complet, `<span class="tampon vert m2-cachet-envoi frappe" data-anim="m2-recu-${S.i}">Reçu conforme<small>${X(a.bl ? a.bl.date : "")}</small></span>`, "recu-" + S.i);
    }
    const checks = un("#main .checks");
    if (checks){
      checks.classList.add("m2-reception");
      const ouvert = !!a.checks[0], b = bien(a.bien);
      const zone = poser(checks, "beforeend", "colis", () => `<div class="m2-colis-zone cpt-cache-mobile" aria-hidden="true">${KIT.colis({ de:f.nom + " " + f.forme, pour:V(deno, ""), adresse:V(adresse1, "") + ", " + V(adresse2, ""), ref:a.bl ? a.bl.numero : "", contenu:b ? b.icone : "📦", nb:"1/1", ouvert })}</div>`);
      const colis = zone && zone.querySelector(".colis");
      if (colis && colis.classList.contains("ouvert") !== ouvert){ colis.classList.toggle("ouvert", ouvert); if (ouvert && COMPTA.premiereFois("colis-" + S.i)) COMPTA.son("papier"); }
    }
  }

  // ─── Étape 6 : la facture sur le bureau, tamponnée selon la décision ───
  function acFacture(){
    const a = A(), o = offreChoisie(a); if (!o) return;
    const bureau = tous("#main .grid.g2").find(g => g.querySelector(".paper"));
    if (bureau) bureau.classList.add("bureau", "m2-bureau-f");
    const papiers = tous("#main .paper");
    papiers.forEach((p) => poser(p, "afterbegin", "entete", () => enteteFournisseur(o, "")));
    const fac = papiers[0];
    arrivee([fac], "facture-" + S.i);
    if (a.nc) arrivee([papiers[1]], "nc-" + S.i, "m2-glisse-d");
    if (fac && a.decision){
      const ok = a.decision === "acceptee";
      poser(fac, "beforeend", "decision", `<span class="m2-decision" aria-hidden="true"><span class="tampon ${ok ? "vert " : ""}frappe" data-anim="m2-decision-${S.i}">${ok ? "Acceptée<small>Bon à payer</small>" : "Contestée<small>Note de crédit demandée</small>"}</span></span>`);
      if (COMPTA.premiereFois("decision-" + S.i)) sonDiffere("tampon", 420);
    }
    papiers.forEach((p) => poser(p, "beforeend", "mention", COMPTA.mention));
    const copie = bureau && bureau.querySelector(".card.tight");
    if (copie && a.bc){ copie.classList.add("m2-copie"); poser(copie, "beforeend", "copie", `<span class="m2-copie-pied" aria-hidden="true"><span class="tampon bleu m2-cachet">Copie client<small>${X(a.bc.numero)} · ${X(a.bc.date)}</small></span></span>`); }
  }

  // ─── Étape 7 : virement ou dette, extrait de compte, journal, classeur ───
  function telephone(a, o){
    return `<div class="m2-tel"><div class="m2-tel-ecran"><div class="m2-tel-app">${COMPTA.logoBanque({ clair:true })}</div><div class="m2-tel-titre">Nouveau virement</div>
      <div class="m2-tel-champ"><small>De</small><b>${X(V(deno, ""))}</b></div><div class="m2-tel-champ"><small>Vers</small><b>${X(o.fournisseur.nom)} ${X(o.fournisseur.forme)}</b></div>
      <div class="m2-tel-montant">${X(euro(montantPaye(a)))}</div><div class="m2-tel-champ"><small>Communication</small><b class="m2-mono">${X(a.facture ? a.facture.numero : "")}</b></div>
      <div class="m2-tel-attente"><i></i>À confirmer</div></div></div>`;
  }
  function calendrier(a, o){
    const ech = a.facture ? a.facture.echeance : "", m = String(ech).match(/^(\d{1,2})\s+(\S+)\s+(\d{4})$/);
    return `<span class="m2-calendrier"><span class="m2-cal-anneaux"></span><span class="m2-cal-mois">${X(m ? m[2] : "Échéance")}</span><span class="m2-cal-jour">${X(m ? m[1] : "")}</span><span class="m2-cal-an">${X(m ? m[3] : ech)}</span><span class="m2-cal-pied">Échéance</span></span>`
      + COMPTA.postit(`À payer<small>${X(o.fournisseur.nom)}<br><span class="m2-nowrap">${X(euro(montantFacture(a)))}</span></small>`, { couleur:"rose", rot:3 });
  }
  function classement(){
    const finis = S.achats.filter(x => x.fini && x.facture), courant = A();
    const dossiers = finis.map((x) => {
      const ox = offreChoisie(x), b = bien(x.bien), paye = x.condition === "comptant";
      return `<div class="m2-dossier${x === courant ? " m2-glisse" : ""}"><span class="m2-d-ico">${X(b ? b.icone : "📄")}</span><span><b>${X(ox.article)}</b><small>Facture ${X(x.facture.numero)} · ${X(ox.fournisseur.nom)} · ${X(euro(montantFacture(x)))}</small><small>+ bon de commande ${X(x.bc ? x.bc.numero : "")} + bon de livraison ${X(x.bl ? x.bl.numero : "")}</small></span>
        <span class="m2-d-statut${paye ? "" : " m2-du"}">${paye ? "✓ Payée" : "À payer · " + X(x.facture.echeance)}</span></div>`;
    }).join("");
    return `<div class="m2-classement" aria-hidden="true" data-anim="m2-classe-${S.i}"><div class="m2-cl-titre">📁 Le dossier est classé : facture, bon de commande et bon de livraison, agrafés ensemble.<b>${achatsRecus().length}/${CONFIG.NB_ACHATS}</b></div>
      <div class="m2-dossiers">${dossiers}</div><div class="m2-cl-classeur cpt-cache-mobile">${COMPTA.classeur({ titre:"Factures fournisseurs", sous:V(deno, "") + " · " + ANNEE(), couleur:"#1e3a6e", feuilles:finis.length, tampon:courant.condition === "comptant" ? "Payée" : "À payer" })}</div></div>`;
  }
  function acPaiement(){
    const a = A(), o = offreChoisie(a); if (!o || !M1) return;
    const comptant = a.condition === "comptant";
    if (!a.fini){
      etatPaiement[S.i] = "attente";
      const carte = tous("#main .card").find(c => c.querySelector('[data-act="payer"]')); if (!carte) return;
      carte.classList.add("m2-ordre");
      poser(carte, "afterbegin", "tete", () => comptant ? COMPTA.entete({ logo:"banque", titre:"Virement européen", sous:"Donneur d'ordre : " + V(deno, "") }) : COMPTA.entete({ gauche:"Échéancier", titre:"Dettes fournisseurs", sous:V(deno, "") }));
      poser(carte, "beforeend", "mention", COMPTA.mention);
      poser(carte, "beforeend", "cote", () => `<div class="m2-ordre-cote cpt-cache-mobile" aria-hidden="true">${comptant ? telephone(a, o) : calendrier(a, o)}</div>`);
      return;
    }
    if (etatPaiement[S.i] === "attente"){ etatPaiement[S.i] = "paye"; COMPTA.son(comptant ? "caisse" : "papier"); }
    const ex = un("#main .extrait");
    arrivee([ex], "releve-" + S.i);
    if (ex){ ex.classList.add("cpt-releve", "m2-releve"); poser(ex, "afterbegin", "tete", () => COMPTA.entete({ logo:"banque", titre:"Extrait de compte", sous:a.extrait ? a.extrait.date : "" })); poser(ex, "beforeend", "mention", COMPTA.mention); }
    const ec = un("#main .ecriture"); if (ec) ec.classList.add("cpt-registre", "m2-journal");
    const navs = tous("#main > .nav"), dernier = navs[navs.length - 1];
    if (dernier) poser(dernier, "beforebegin", "classement", classement);
  }

  // ─── Bilan (écran bilan et fin) : un document, avec sa balance ───
  function bilanDoc(){
    const bl = un("#main .bilan"); if (!bl || !M1) return;
    const d = bilanData();
    bl.classList.add("m2-bilan-doc");
    arrivee([bl], "bilan-" + ecran());
    poser(bl, "afterbegin", "tete", () => `<div class="m2-bilan-tete" aria-hidden="true"><div><b>Bilan après équipement</b><small>${X(V(deno, ""))} · ${X(today())}</small>${COMPTA.mention()}</div>${COMPTA.balance(d.equilibre, { couleurTexte:"#14284b" })}${S.done && S.done.bilan ? `<span class="tampon vert frappe" data-anim="m2-bilan-ok">Validé</span>` : ""}</div>`);
  }

  // ─── Fin : la boutique équipée, allumée, en fête ───
  function guirlande(){
    const C = ["#e3b85c", "#ff3d8b", "#9d4edd", "#22d3ee", "#f6f1e6"], n = 14, y = (x) => 4 + 136 * (x / 400) * (1 - x / 400);
    let s = `<path d="M0 4Q200 72 400 4" stroke="#2b2340" stroke-width="1.6" fill="none"/>`;
    for (let i = 0; i < n; i++){
      const x = 400 * (i + .5) / n;
      s += `<path d="M${(x - 10).toFixed(1)} ${y(x - 10).toFixed(1)}L${(x + 10).toFixed(1)} ${y(x + 10).toFixed(1)}L${x.toFixed(1)} ${(y(x) + 21).toFixed(1)}z" fill="${C[i % C.length]}" stroke="rgba(0,0,0,.18)" stroke-width=".6"/>`;
      if (i) s += `<circle cx="${(400 * i / n).toFixed(1)}" cy="${(y(400 * i / n) + 2).toFixed(1)}" r="6" fill="#fff3c4" opacity=".28"/><circle cx="${(400 * i / n).toFixed(1)}" cy="${(y(400 * i / n) + 2).toFixed(1)}" r="2.4" fill="#fff6d6"/>`;
    }
    return `<svg class="m2-guirlande m2-tombe" viewBox="0 0 400 70" aria-hidden="true" data-anim="m2-guirlande">${s}</svg>`;
  }
  function fin(){
    const cadre = un("#main .duo .front-wrap");
    if (cadre){ cadre.classList.add("m2-fete-cadre"); poser(cadre, "beforeend", "guirlande", guirlande()); poser(cadre, "beforeend", "ruban", `<span class="m2-ruban" aria-hidden="true">Équipée !</span>`); }
    const j = un("#main table.journal"); if (j) j.classList.add("cpt-registre", "m2-registre-table");
    bilanDoc();
  }

  // ─── Mission fermée (la boutique, éteinte, la nuit) ou bloquée (le local vide, à louer) ───
  function nuit(vide){
    const hero = un("#main .hero"); if (!hero) return;
    const m = M1, t = m ? TYPES.find(x => x.id === m.typeId) : null;
    const svg = vide || !m || !t ? vitrineSVG({ aLouer:true, nuit:true, allumee:false }, "m2nuit")
      : vitrineSVG({ nom:String(m.nom || "").trim() || "Ton enseigne", couleur:m.couleur || "#8E4EC6", couleur2:m.couleur2 || "#FFFFFF", style:m.style || "moderne", symbole:m.symbole || t.emoji,
          facade:m.facade || "", auvent:m.auvent || "", ambiance:m.ambiance || "", accueil:"", numero:m.numero || "", produits:t.vitrine, equipement:EQUIPEMENT_VITRINE(), panneau:"FERMÉ", allumee:false, nuit:true }, "m2nuit");
    poser(hero, "afterbegin", "nuit", `<div class="m2-nuit kit-anim" aria-hidden="true" data-anim="m2-nuit">${svg}</div>`);
  }

  // ─── Le jeton du solde Borinage Banque, à côté de l'étape ───
  function jeton(){
    if (!M1 || (MODE !== "mission" && MODE !== "consultation")) return;
    const cible = un("#main .achat-tag") || un("#main .kick"); if (!cible) return;
    const solde = euro0(banque()), el = poser(cible, "beforeend", "jeton", `<span class="m2-jeton" aria-hidden="true">${COMPTA.logoBanque({ clair:true })}<b>${X(solde)}</b></span>`);
    const b = el && el.querySelector(":scope > b"); if (b && b.textContent !== solde) b.textContent = solde;
  }

  const ECRANS = { briefing, budget, ac_bien:acBien, ac_methode:acMethode, ac_offres:acOffres, ac_commande:acCommande, ac_livraison:acLivraison, ac_facture:acFacture, ac_paiement:acPaiement,
    bilan:bilanDoc, fin, ferme:() => nuit(false), bloque:() => nuit(true) };
  function decorer(){
    try {
      if (!document.getElementById("main")) return;
      COMPTA.coachs(document);                                        // Nadia dessinée à la place de l'émoji
      const e = ecran();
      if (ECRANS[e]) ECRANS[e]();
      jeton();
    } catch(e) { console.warn("décor :", e); }
  }
  // ─── Accroche (seules affectations permises : render, refreshLive, vitrine, toast, confetti) ───
  const renduOrigine = render, rafraichiOrigine = refreshLive, toastOrigine = toast, confettiOrigine = confetti;
  render = function(scroll){ renduOrigine(scroll); decorer(); };
  refreshLive = function(){ rafraichiOrigine(); decorer(); };
  vitrine = COMPTA.vitrineEQ;                                         // façade réaliste : mêmes choix, mêmes valeurs par défaut
  toast = function(html, cls){ toastOrigine(html, cls); COMPTA.son(cls === "word" ? "notif" : /^<b>\+\d+ XP/.test(String(html)) ? "xp" : "notif"); };
  confetti = function(){ confettiOrigine(); COMPTA.son("fanfare"); };
  window.__decor = { renduOrigine, decorer, ecran };
  COMPTA.creditsImages();                                             // crédits des photos de matières (CC0), au bas de la page
  if (document.querySelector("#main svg.front, #side svg.front")) render(); else decorer();
  return { decorer, ecran };
})();
// ═══ DÉCOR MISSION 2 — fin ═══
</script>
</body>
</html>
